services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hafez
      POSTGRES_PASSWORD: hafez
      POSTGRES_DB: hafez
    ports:
      - "5432:5432"
    volumes:
      - hafez_pg:/var/lib/postgresql/data
      - ./docker/init-grants.sql:/docker-entrypoint-initdb.d/02-grants.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hafez -d hafez"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://hafez:hafez@postgres:5432/hafez?schema=public
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  hafez_pg:
