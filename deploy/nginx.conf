# ONE GOOD — Nginx TLS reverse proxy (production example)
# Replace one-good.example.ir with the real .ir domain registered for ZarinPal callbacks.

limit_req_zone $binary_remote_addr zone=onegood_api:10m rate=10r/s;

upstream onegood_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name one-good.example.ir;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name one-good.example.ir;

    ssl_certificate     /etc/letsencrypt/live/one-good.example.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/one-good.example.ir/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 12m;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Health for external uptime (no HTML)
    location = /api/health {
        proxy_pass http://onegood_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Tighter limit on mutation APIs
    location /api/ {
        limit_req zone=onegood_api burst=20 nodelay;
        proxy_pass http://onegood_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Optional self-hosted analytics (Umami) on same host
    # location /analytics/ {
    #     proxy_pass http://127.0.0.1:3001/;
    #     proxy_set_header Host $host;
    # }

    location / {
        proxy_pass http://onegood_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
